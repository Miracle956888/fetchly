<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetchly — Save videos as MP4 or MP3, fast and free</title>
    <meta
      name="description"
      content="Paste a public link, choose a format and quality, and download MP4 or MP3. No account needed; availability varies by source."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fetchly" />
    <meta property="og:title" content="Fetchly — Save videos as MP4 or MP3" />
    <meta
      property="og:description"
      content="Paste a public link, choose a format and quality, and download. Availability varies by source."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fetchly — Save videos as MP4 or MP3" />
    <meta
      name="twitter:description"
      content="Paste a public link, choose a format and quality, and download. Availability varies by source."
    />

    <meta name="theme-color" content="#00C9A7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F0E" media="(prefers-color-scheme: dark)" />

    <!-- Same-origin script works with the server's Content Security Policy. -->
    <script src="/theme-init.js"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Fetchly",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "description": "Save public videos from supported platforms as MP4 or MP3.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
