# Edge reverse proxy: TLS termination, static frontend, API routing.
upstream api {
    server backend:3000;
}

upstream web {
    server frontend:80;
}

server {
    listen 80;
    server_name fetchly.example.com;
    # In production terminate TLS here (or at Cloudflare) and redirect:
    # return 301 https://$host$request_uri;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security headers (complement Helmet on the API)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Frontend (built React app served by the frontend container's nginx)
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
