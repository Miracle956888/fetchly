# Serves the built React app with SPA fallback.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirror the edge proxy; this vhost may also be public).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Vite emits content-hashed filenames under /assets/, so those are safe to
    # cache forever. Everything else (index.html, robots, sitemap, og-cover,
    # favicon) must revalidate, otherwise a deploy leaves users requesting
    # asset names that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~* ^/(robots\.txt|sitemap\.xml|favicon\.svg|og-cover\.png)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # SPA fallback: any client-side route renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
