<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Apex ICT Academy</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--admin-primary), #4f46e5);
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      margin-bottom: 1rem;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .input-field {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      transition: var(--transition);
      outline: none;
    }
    .input-field:focus {
      border-color: var(--admin-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .password-wrapper {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-login {
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--admin-primary);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      margin-top: 0.5rem;
    }
    .btn-login:hover:not(:disabled) {
      background-color: var(--admin-primary-hover);
      transform: translateY(-1px);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .alert-banner {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1rem;
      background-color: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }
    .alert-banner.visible {
      display: block;
    }
    .credentials-hint {
      margin-top: 1.5rem;
      padding: 1rem;
      background-color: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="login-title">Admin Console</h1>
        <p class="login-subtitle">Sign in to access the ICT Lead Management System</p>
      </div>

      <div id="loginAlert" class="alert-banner" role="alert"></div>

      <form id="adminLoginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input
            type="text"
            id="username"
            name="username"
            class="input-field"
            placeholder="admin or admin@ictacademy.org"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="input-field"
              placeholder="••••••••••••"
              required
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
          Sign In to Dashboard &rarr;
        </button>
      </form>

      <div class="credentials-hint">
        <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 0.35rem;">Default Administrator Credentials:</div>
        <div>Username: <code>admin</code></div>
        <div>Password: <code>AdminPassword2026!</code></div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="/" style="font-size: 0.85rem; color: var(--text-muted);">&larr; Return to Public Website</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
