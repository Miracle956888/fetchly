# Netlify config for the Fetchly frontend (static SPA).
# Easiest: build locally, then drag the client/dist folder onto
# https://app.netlify.com/drop — no repo, no card.
#
# When connecting the repo instead, set the build-time site metadata in
# Site settings → Environment variables:
#   VITE_SITE_URL      https://yourdomain.com   (canonical/og/robots/sitemap)
#   VITE_CONTACT_EMAIL dmca@yourdomain.com      (DMCA page)
#   VITE_API_ORIGIN    https://api.yourdomain.com   (ONLY if the API is on a
#                      different origin; leave unset behind a same-origin proxy)

[build]
  command = "npm ci --no-audit --no-fund && npm run build -w client"
  publish = "client/dist"

# SPA fallback: every client-side route must resolve to the app shell so
# direct loads and hard refreshes of /downloads, /admin/…, etc. never 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable — cache them aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app shell and metadata must never be served stale, otherwise users keep
# requesting asset filenames that no longer exist after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
