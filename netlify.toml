# Experimental single-instance Netlify Server beta. This is separate from
# Render; see docs/NETLIFY.md for required runtime secrets and limitations.
[build]
  command = "VITE_API_ORIGIN='' VITE_ASYNC_ANALYSIS=true npm run build && python3 scripts/netlify-binaries.py"
  publish = "client/dist"

[build.environment]
  # Netlify Server runs the same Node major version used by the build.
  NODE_VERSION = "24"

[server]
  size = "small"
  # The API uses local files plus in-memory state; multiple live instances
  # would send subsequent polling/delivery requests to the wrong instance.
  includedFiles = ["netlify/server/bin/**", "client/dist/**"]

[server.scale]
  max = 1

# Do not add a catch-all SPA rewrite: rewrites run before Netlify Server and
# would swallow /api requests. The server provides the deep-link fallback.
