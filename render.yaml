# Limited free-tier beta: one Docker web service serves both UI and API.
# Deploy from a branch containing this file via New > Blueprint on Render.
# See docs/RENDER.md for setup, limits, and post-deploy checks.
services:
  - type: web
    name: fetchly
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@fetchly.local
      - key: ADMIN_PASSWORD
        generateValue: true
      # Keep the free instance's CPU, memory and ephemeral storage usage modest.
      - key: JOB_CONCURRENCY
        value: "1"
      - key: MAX_PENDING_JOBS
        value: "10"
      - key: MAX_CONCURRENT_ANALYSES
        value: "1"
      - key: MAX_CONCURRENT_JOBS_PER_IP
        value: "2"
      - key: MAX_DOWNLOAD_SIZE_MB
        value: "100"
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: "300"
      - key: PROCESS_TIMEOUT_SECONDS
        value: "300"
      - key: MIN_FREE_DISK_MB
        value: "256"
      # No DATABASE_URL or REDIS_URL: data and queued jobs are ephemeral.
